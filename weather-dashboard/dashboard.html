<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather forecasting site</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

    <header class="header">
        <h2 id="h1"> <i class="fa-solid fa-cloud"></i> Weather now</h2>

        <button id="button"> <i class="fa-solid fa-gear"></i> Units <i class="fa-solid fa-angle-down"></i> </button>
    </header>

    <main>
    <section class="a">

        <div class="search">
            <h1>How's the sky looking today?</h1>
            <button id="searchbar"> <i class="fa-solid fa-magnifying-glass"></i> Search for a place...</button>
            <button id="searchbutton">Search</button>
        </div>

    </section>


<section class="b">      
    <div class="Left">
         <div id="germany">

                <img src="germany weather.jpg" alt="germany weather" height="200">

        </div>

        <div class="weather">
                <div class="box">
                        <p>Feels like</p>
                        <h2>18 </h2>
                </div>
                
                <div class="box">
                        <p>Humidity</p>
                        <h2>46%</h2>
                </div>
               
                <div class="box">
                        <p>Wind</p>
                        <h2>14 km/h</h2>
                </div>
               
                <div class="box">
                        <p>Precipitation</p>
                        <h2>0 mm</h2>
                </div>
        </div>   
        

    
        
        <div class="weekly">

            <h5>Daily forecast</h5>

        <div class="weekbox">
            <div class="week">
                <h5>Tue</h5>
                <i class="fa-solid fa-cloud-rain"></i>
                <p><span>20</span>
                <span>14</span></p>

            </div>

            <div class="week">
                <h5>Wed</h5>
                <i class="fa-solid fa-cloud-showers-heavy"></i>
                <p><span>20</span>
                <span>13</span></p>
            </div>

            <div class="week">
                <h5>Thu</h5>
                <i class="fa-solid fa-bahai"></i>
                <p><span>21</span>
                <span>17</span></p>
                
            </div>

            <div class="week">
                <h5>Fri</h5>
                <i class="fa-solid fa-cloud-sun"></i>
                <p><span>20</span>
                <span>14</span></p>
                
            </div>

            <div class="week">
                <h5>Sat</h5>
                <i class="fa-solid fa-cloud-bolt"></i>
                <p><span>20</span>
                <span>14</span></p>
                
            </div>
            <div class="week">
                <h5>Sun</h5>
                <i class="fa-solid fa-cloud-rain"></i>
                <p><span>20</span>
                <span>14</span></p>
                
            </div>
            <div class="week">
                <h5>Mon</h5>
                <i class="fa-solid fa-wind"></i>
                <p><span>20</span>
                <span>14</span></p>
                
            </div>

        </div>

        </div>

    </div>

    <div class="Right">
        <p><span>Hourly Forecast</span>
        <button>Tuesday <i class="fa-solid fa-angle-down"></i></button></p>
           <div class="hourly"> 
                
                <span><i class="fa-solid fa-cloud"></i>  3 PM</span>  
                <span>20</span> 
            </div>
           <div class="hourly">  
                <span><i class="fa-solid fa-cloud-sun"></i>4 PM</span>    
                <span>20</span>   
            </div>
           <div class="hourly">    
                <span><i class="fa-solid fa-bahai"></i> 5 PM</span>    
                <span>20</span>    
            </div>
           <div class="hourly">   
                <span><i class="fa-solid fa-cloud"></i> 6 PM</span>    
                <span>19</span>    
            </div>
           <div class="hourly">   
                <span><i class="fa-solid fa-cloud-rain"></i>7 PM</span>    
                <span>18</span>    
            </div>
           <div class="hourly">  
                <span> <i class="fa-solid fa-wind"></i>8 PM</span>    
                <span>18</span>    
            </div>
           <div class="hourly">   
                 
                <span><i class="fa-solid fa-cloud-rain"></i>9 PM</span>
                <span>17</span> 
            </div>
            <div class="hourly">
                <span><i class="fa-solid fa-cloud"></i>10 PM</span> 
                <span>17</span>
            </div>

    </div>

</section>

</main>

</body>
</html>
